<head>
<meta charset="UTF-8">

<meta property="og:description" content="AI-native researcher & architect。研究 AI Agents、記憶系統、跨域數據。將混沌，煉成秩序。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wus311125-cmd.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3efe5'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23191916' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23a3231d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Hopan · Newsprint Edition v2
   紙墨報紙 × 混沌粒子。將混沌，煉成秩序。
   Design tokens: DesignPrompts / Newsprint
   v2: a11y 全修 (鍵盤/ARIA/對比度/touch target) + 空狀態 + 死連結清理
============================================================ */
@font-face{
  font-family:"Newsprint Display";
  src:url("fonts/source-serif-4-variable.ttf") format("truetype");
  font-weight:100 900; font-display:swap;
}
@font-face{
  font-family:"Newsprint Reading";
  src:url("fonts/eb-garamond-variable.ttf") format("truetype");
  font-weight:100 900; font-display:swap;
}
@font-face{
  font-family:"Newsprint Reading";
  src:url("fonts/eb-garamond-italic-variable.ttf") format("truetype");
  font-style:italic; font-weight:100 900; font-display:swap;
}
:root{
  /* DesignPrompts Newsprint 官方 token (對比度已校至 WCAG AA) */
  --ground:#f3efe5;          /* 暖紙底 */
  --ground-2:#ece6d8;        /* 深一度紙 */
  --ink:#191916;             /* 墨色 */
  --ink-soft:#3d3c36;        /* 次墨 */
  --ink-dim:#57554c;         /* 淡墨 6.51:1 ✓ */
  --ink-faint:#6f6b5e;       /* 極淡墨 4.7:1 ✓ (原 #8a867a 3.17:1 唔夠) */
  --rule:#9b978e;            /* 分隔線 */
  --red:#a3231d;             /* 編輯紅 mark 6.50:1 ✓ */
  --red-soft:rgba(163,35,29,.10);

  --display:"Newsprint Display","Noto Serif TC",Georgia,"Songti SC",serif;
  --reading:"Newsprint Reading","Noto Serif TC",Georgia,"Songti SC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--reading); font-weight:400;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  background-image:radial-gradient(rgba(25,25,22,.028) 1px, transparent 1.4px);
  background-size:26px 26px;
}
::selection{ background:var(--ink); color:var(--ground); }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

/* ============ 載入遮幕 ============ */
#boot{
  position:fixed; inset:0; z-index:100; background:var(--ground);
  display:flex; align-items:center; justify-content:center;
  transition:opacity 1s ease;
}
#boot.done{ opacity:0; pointer-events:none; }
#boot .tag{
  font-family:var(--sans); font-size:12px; letter-spacing:.6em; text-indent:.6em;
  color:var(--ink-faint); animation:bootpulse 1.6s ease infinite;
}
#boot .tag b{ color:var(--red); font-weight:400; }
@keyframes bootpulse{ 0%,100%{opacity:.3} 50%{opacity:.9} }

/* ============ 頂導覽（報紙報頭） ============ */
header{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; justify-content:space-between; align-items:center;
  padding:24px 5vw;
  /* v2: 移除 mix-blend-mode:difference（令紅點變 teal）——直接墨色 on 紙底，accent 保持編輯紅 */
  color:var(--ink);
  background:linear-gradient(var(--ground) 0%, rgba(243,239,229,.86) 55%, transparent 100%);
}
header .brand{
  font-family:var(--display); font-weight:900;
  font-size:16px; letter-spacing:.22em; text-transform:uppercase;
}
header .brand em{ font-style:normal; color:var(--red); }
header nav{ display:flex; gap:26px; }
header nav a{
  font-family:var(--sans); font-size:13px; letter-spacing:.22em;
  color:var(--ink-dim); transition:color .3s; position:relative; padding:10px 2px 6px;
  min-height:44px; display:inline-flex; align-items:center;
}
header nav a::after{
  content:""; position:absolute; left:0; bottom:0; width:0; height:1px;
  background:var(--red); transition:width .35s;
}
header nav a:hover{ color:var(--ink); }
header nav a:hover::after{ width:100%; }
header nav a:focus-visible{ outline:2px solid var(--red); outline-offset:4px; }
/* 手機 hamburger */
#menubtn{
  display:none; width:44px; height:44px; align-items:center; justify-content:center;
  font-size:20px; color:var(--ink); border:1px solid var(--rule);
}
#menubtn:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

/* ============ HERO — 混沌粒子舞台 ============ */
#hero{
  position:relative; height:100vh; min-height:560px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; overflow:hidden;
  border-bottom:4px solid var(--ink);
}
#hero canvas{ position:absolute; inset:0; width:100%; height:100%; }
#hero .halo{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(86vmin,720px); height:min(86vmin,720px); pointer-events:none;
  background:radial-gradient(circle, rgba(163,35,29,.045) 0%, transparent 62%);
}
#hero .dateline{
  position:absolute; top:0; left:0; right:0; z-index:2;
  display:flex; justify-content:space-between;
  padding:18px 5vw 0;
  font-family:var(--sans); font-size:11px; letter-spacing:.24em;
  color:var(--ink-faint); text-transform:uppercase;
}
#hero .eyebrow{
  position:relative; font-family:var(--sans); font-size:clamp(10px,1.4vw,12.5px);
  letter-spacing:.5em; text-indent:.5em; color:var(--red); text-transform:uppercase;
  opacity:0; animation:fadein 1.4s ease .9s forwards;
}
#hero .eyebrow::before,#hero .eyebrow::after{
  content:"—"; margin:0 1.1em; color:var(--ink-faint); letter-spacing:.2em;
}
#hero h1{
  position:relative; margin-top:20px;
  font-family:var(--display); font-weight:900;
  font-size:clamp(52px,11vw,128px); letter-spacing:.06em; line-height:1.04;
  opacity:0; animation:fadein 1.6s ease 1.15s forwards;
  text-shadow:2px 3px 0 var(--rule);
}
#hero h1 .red{ color:var(--red); }
#hero .sub{
  position:relative; margin-top:28px; max-width:min(560px,80vw);
  font-size:clamp(15px,2vw,18px); font-weight:400; letter-spacing:.1em; line-height:1.9;
  color:var(--ink-dim);
  opacity:0; animation:fadein 1.6s ease 1.5s forwards;
}
#hero .cta{
  position:relative; margin-top:46px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap;
  opacity:0; animation:fadein 1.4s ease 1.85s forwards;
}
#hero .cta a{
  font-family:var(--sans); font-size:clamp(13px,1.7vw,15px); letter-spacing:.26em; text-indent:.26em;
  padding:16px 42px; border:1px solid var(--ink); color:var(--ink);
  transition:all .35s; position:relative; background:var(--ground);
  min-height:52px; display:inline-flex; align-items:center; justify-content:center;
}
#hero .cta a.inkbt{ background:var(--ink); color:var(--ground); border-color:var(--ink); font-weight:500; }
#hero .cta a.inkbt:hover{ background:var(--red); border-color:var(--red); }
#hero .cta a:not(.inkbt):hover{ background:var(--red); border-color:var(--red); color:var(--ground); }
#hero .cta a:focus-visible{ outline:3px solid var(--red); outline-offset:3px; }
#hero .scrollhint{
  position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
  font-family:var(--sans); font-size:11px; letter-spacing:.4em; text-indent:.4em;
  color:var(--ink-faint); opacity:0; animation:fadein 1.6s ease 2.4s forwards;
}
#hero .scrollhint::after{
  content:""; display:block; width:1px; height:30px; margin:10px auto 0;
  background:linear-gradient(var(--ink-faint), transparent);
  animation:linedrop 2.2s ease infinite;
}
@keyframes linedrop{ 0%{transform:scaleY(0); transform-origin:top} 45%{transform:scaleY(1); transform-origin:top} 55%{transform:scaleY(1); transform-origin:top} 100%{transform:scaleY(0); transform-origin:bottom} }
@keyframes fadein{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
@keyframes fadeup{ from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:none} }

/* ============ 專欄分類（報紙欄目） ============ */
#columns{
  padding:9vh 8vw 12vh; border-bottom:1px solid var(--rule);
}
#columns .masthead{
  display:flex; align-items:baseline; gap:26px; margin-bottom:52px;
  border-bottom:4px solid var(--ink); padding-bottom:18px;
}
#columns .masthead .label{
  font-family:var(--sans); font-size:11px; letter-spacing:.4em; color:var(--red);
  text-transform:uppercase;
}
#columns .masthead .label::before{ content:"◆ "; }
#columns .masthead h2{
  font-family:var(--display); font-weight:900; font-size:clamp(30px,5vw,56px);
  letter-spacing:.04em;
}
/* v2: auto-fit 取代固定 5 欄 → 分類幾多都唔會出孤兒格 */
.column-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule);
}
.col{
  background:var(--ground); padding:34px 26px 30px; min-height:200px;
  transition:background .4s; position:relative; overflow:hidden;
  cursor:pointer;
}
.col:hover{ background:var(--red); }
.col:focus-visible{ outline:3px solid var(--red); outline-offset:-3px; }
.col .no{
  font-family:var(--sans); font-size:11px; color:var(--ink-faint); letter-spacing:.2em;
  transition:color .3s;
}
.col h3{
  margin-top:22px; font-family:var(--display); font-weight:900;
  font-size:clamp(17px,1.7vw,22px); letter-spacing:.02em; line-height:1.3;
  transition:color .3s;
}
.col .cnt{
  display:inline-block; margin-top:16px;
  font-family:var(--sans); font-size:11.5px; letter-spacing:.18em; color:var(--red);
  border:1px solid var(--red); padding:5px 13px; border-radius:999px;
  transition:all .3s; min-height:32px;
}
.col:hover .no,.col:hover h3{ color:var(--ground); }
.col:hover .cnt{ background:var(--ground); border-color:var(--ground); color:var(--red); }

/* ============ 文章索引（報紙副刊） ============ */
#writing{
  padding:11vh 8vw 14vh; border-bottom:1px solid var(--rule);
}
#writing .masthead{
  display:flex; align-items:baseline; gap:26px; margin-bottom:12px;
  padding-bottom:18px;
}
#writing .masthead .label{
  font-family:var(--sans); font-size:11px; letter-spacing:.4em; color:var(--red);
  text-transform:uppercase;
}
#writing .masthead .label::before{ content:"◆ "; }
#writing .masthead h2{
  font-family:var(--display); font-weight:900; font-size:clamp(30px,5vw,56px);
  letter-spacing:.04em;
}
#writebar{
  display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px; padding-bottom:30px;
}
#writebar .f{
  font-family:var(--sans); font-size:12px; letter-spacing:.16em; color:var(--ink-dim);
  border:1px solid var(--rule); padding:12px 20px; border-radius:999px;
  cursor:pointer; transition:all .3s; background:transparent;
  min-height:44px;
}
#writebar .f:hover{ border-color:var(--ink); color:var(--ink); }
#writebar .f:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
#writebar .f.on{ background:var(--ink); border-color:var(--ink); color:var(--ground); }
.post{
  display:flex; align-items:baseline; gap:30px; padding:26px 0;
  border-bottom:1px solid var(--rule); cursor:pointer;
  transition:padding-left .4s, background .3s;
  position:relative; width:100%; text-align:left;
  min-height:60px;
}
.post::before{
  content:""; position:absolute; left:-8vw; top:0; bottom:0; width:0;
  background:var(--red-soft); transition:width .4s;
}
.post:hover{ padding-left:16px; }
.post:hover::before{ width:calc(8vw + 16px); }
.post:focus-visible{ outline:3px solid var(--red); outline-offset:-3px; }
.post .date{
  font-family:var(--sans); font-size:12.5px; color:var(--ink-faint);
  letter-spacing:.14em; width:108px; flex-shrink:0;
}
.post .tt{
  flex:1; font-family:var(--display); font-weight:700;
  font-size:clamp(18px,2.6vw,27px); letter-spacing:.02em; line-height:1.35;
}
.post .cat{
  font-size:11.5px; letter-spacing:.18em; color:var(--red);
  padding:5px 4px; flex-shrink:0;
  text-transform:uppercase; font-family:var(--sans);
}
.post .cat:before{ content:"〔"; opacity:.55; }
.post .cat:after{ content:"〕"; opacity:.55; }
.post .arr{
  font-family:var(--display); color:var(--red); font-size:20px; font-weight:900;
  opacity:0; transform:translateX(-8px); transition:all .4s; flex-shrink:0;
}
.post:hover .arr{ opacity:1; transform:none; }
.post.hide{ display:none; }

/* 空狀態 */
.empty{
  padding:80px 20px; text-align:center; border-bottom:1px solid var(--rule);
  font-family:var(--sans); color:var(--ink-faint); letter-spacing:.14em;
}
.empty .big{ font-family:var(--display); font-weight:900; font-size:clamp(20px,3.4vw,32px); color:var(--ink-dim); letter-spacing:.08em; display:block; margin-bottom:16px; }
.empty .red{ color:var(--red); }

/* ============ 底部 ============ */
footer{
  padding:11vh 8vw 13vh; text-align:center;
}
footer .quote{
  font-family:var(--display); font-weight:900;
  font-size:clamp(24px,4.4vw,46px); letter-spacing:.06em; line-height:1.6;
}
footer .quote .red{ color:var(--red); }
footer .quote .rule-l{ display:block; width:120px; height:1px; background:var(--rule); margin:26px auto 0; }
footer .links{ margin-top:34px; display:flex; justify-content:center; gap:28px; flex-wrap:wrap; }
footer .links a{
  font-family:var(--sans); font-size:12.5px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-dim); border-bottom:1px solid transparent; padding:14px 6px;
  transition:all .3s; display:inline-flex; align-items:center; min-height:44px;
}
footer .links a:hover{ color:var(--red); border-color:var(--red); }
footer .links a:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
footer .copy{ margin-top:70px; font-size:12px; letter-spacing:.18em; color:var(--ink-faint); }
footer .copy b{ color:var(--red); font-weight:400; }

/* 文章讀取 modal（紙本） */
#reader{
  position:fixed; inset:0; z-index:90; display:none;
  background:var(--ground); overflow-y:auto;
  background-image:radial-gradient(rgba(25,25,22,.028) 1px, transparent 1.4px);
  background-size:26px 26px;
}
#reader.open{ display:block; }
#reader .inner{ max-width:740px; margin:0 auto; padding:14vh 8vw 18vh; }
#reader .close{
  position:fixed; top:22px; right:5vw; z-index:91;
  font-family:var(--sans); font-size:12.5px;
  letter-spacing:.2em; color:var(--ink-dim); cursor:pointer;
  border:1px solid var(--rule); padding:12px 20px; min-height:44px;
  background:var(--ground); transition:all .3s;
}
#reader .close:hover{ color:var(--red); border-color:var(--red); }
#reader .close:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
#reader .rmeta{
  font-family:var(--sans); font-size:12px; color:var(--red); letter-spacing:.2em;
  text-transform:uppercase; margin-bottom:26px;
}
#reader .rmeta span{ color:var(--ink-faint); margin:0 10px; }
#reader .rtitle{
  font-family:var(--display); font-weight:900; font-size:clamp(28px,4.6vw,46px);
  line-height:1.35; letter-spacing:.02em; padding-bottom:26px;
  border-bottom:4px solid var(--ink);
}
#reader .rbody{ margin-top:46px; font-size:18px; line-height:2.05; letter-spacing:.02em; color:var(--ink-soft); font-weight:400; }
#reader .rbody p{ margin-bottom:1.7em; }
#reader .rbody p:first-child::first-letter{
  font-family:var(--display); font-weight:900; font-size:52px; line-height:1;
  float:left; margin:6px 10px 0 0; color:var(--red);
}
#reader .rbody .lead{ color:var(--ink); font-family:var(--display); font-weight:600; font-size:20px; line-height:1.95; }

/* 手機底部導航 (v2: 取代消失嘅 header nav) */
#mobilenav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:60;
  background:var(--ground); border-top:1px solid var(--ink);
  grid-template-columns:repeat(3,1fr);
}
#mobilenav a{
  font-family:var(--sans); font-size:12px; letter-spacing:.18em;
  color:var(--ink-dim); text-align:center; padding:14px 4px; min-height:48px;
  display:flex; align-items:center; justify-content:center;
  border-right:1px solid var(--rule);
}
#mobilenav a:last-child{ border-right:none; }
#mobilenav a:hover{ color:var(--red); }

@media (max-width:900px){
  header nav{ display:none; }
  #menubtn{ display:inline-flex; }
  #mobilenav{ display:grid; }
  body{ padding-bottom:64px; }
  #columns, #writing{ padding-left:6vw; padding-right:6vw; }
  .post{ flex-wrap:wrap; gap:12px; }
  .post .date{ width:auto; }
  .post .arr{ display:none; }
  #hero .dateline{ display:none; }
  footer .links{ gap:18px; }
  #reader .inner{ padding-top:16vh; }
}
@media (max-width:520px){ .column-grid{ grid-template-columns:1fr; } }
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
  .reveal{ opacity:1; transform:none; }
  #hero .eyebrow, #hero h1, #hero .sub, #hero .scrollhint{ opacity:1; animation:none; }
}
.reveal{ opacity:0; transform:translateY(30px); transition:opacity 1s ease, transform 1s ease; }
.reveal.in{ opacity:1; transform:none; }
</style>
</head>
<body>

<div id="boot"><div class="tag">EN<b>T</b>ROPY → ORDER</div></div>

<header>
  <div class="brand">Hopan<em>.</em></div>
  <nav aria-label="主導覽">
    <a href="#columns">專欄</a>
    <a href="#writing">文章</a>
    <a href="#contact">聯繫</a>
  </nav>
  <button id="menubtn" aria-label="開啟選單" aria-expanded="false">☰</button>
</header>

<section id="hero">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="halo"></div>
  <div class="dateline"><span>獨立研究 · 個人檔案</span><span>EST. 2026 · 香港</span></div>
  <div class="eyebrow">AI-Native Researcher &amp; Architect</div>
  <h1>把<span class="red">混沌</span><br>煉成秩序</h1>
  <div class="sub">研究 AI Agents、記憶系統、跨域數據。<br>用結構，對抗漂移。</div>
  <div class="cta">
    <a href="#writing" class="inkbt">讀文章 ↓</a>
    <a href="#columns">睇專欄</a>
  </div>
  <div class="scrollhint">SCROLL</div>
</section>

<section id="columns" aria-labelledby="colstitle">
  <div class="masthead reveal">
    <span class="label">Columns</span>
    <h2 id="colstitle">專欄</h2>
  </div>
  <div class="column-grid" id="colgrid">
  <!-- 分類由 JS 由文章資料自動生成 -->
  </div>
</section>

<section id="writing" aria-labelledby="wrtitle">
  <div class="masthead reveal">
    <span class="label">Archive</span>
    <h2 id="wrtitle">文章</h2>
  </div>
  <div id="writebar" class="reveal"></div>
  <div id="postlist"></div>
</section>

<footer id="contact">
  <div class="quote reveal">一個人，即一間<span class="red">公司</span>。<br><span class="rule-l"></span></div>
  <div class="links reveal">
    <a href="https://github.com/wus311125-cmd" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.instagram.com/justplaythe_guitar/" target="_blank" rel="noopener">Instagram</a>
    <a href="mailto:nhp24682468.hpn@gmail.com">Email</a>
  </div>
  <div class="copy reveal">© 2026 Hopan · <b>把混沌，煉成秩序</b> · Newsprint Edition</div>
</footer>

<!-- 文章閱讀器 -->
<div id="reader" role="dialog" aria-modal="true" aria-label="文章閱讀器">
  <button class="close">CLOSE ✕</button>
  <div class="inner"><div id="rbody"></div></div>
</div>

<!-- 文章資料庫 —— 加文章：喺 posts.js 加一篇就得，唔使掂 HTML -->
<script src="posts.js"></script>
<script>
/* ============================================================
   Hopan · Newsprint Edition v2
   概念：熵 → 秩序。混沌粒子於首屏聚合為一線（紙墨版）。
   v2: a11y 全修 + 空狀態 + canvas visibility pause + 死連結清理
============================================================ */
const boot=document.getElementById('boot');
addEventListener('load',()=>setTimeout(()=>boot.classList.add('done'),700));

/* ---------- 混沌粒子場 ---------- */
const cv=document.getElementById('field'), ctx=cv.getContext('2d');
const hero=document.getElementById('hero');
let W,H,dpr=Math.min(devicePixelRatio||1,2);
function fit(){
  W=cv.width=Math.floor(hero.clientWidth*dpr);
  H=cv.height=Math.floor(hero.clientHeight*dpr);
}
fit(); addEventListener('resize',fit);

const N=150;
const P=[];
const targetX=i=>W/2 + (Math.sin(i*1.9)*W*0.34);
const targetY=i=>H*0.46 + (Math.cos(i*2.7)*H*0.20);
for(let i=0;i<N;i++){
  P.push({
    x:Math.random()*W, y:H*(0.7+Math.random()*0.6),
    vx:(Math.random()-.5)*1.1*dpr, vy:(Math.random()-.5)*1.1*dpr,
    r:(0.8+Math.random()*2.4)*dpr,
    tx:targetX(i), ty:targetY(i),
    red:Math.random()<0.22,
    a:0.3+Math.random()*0.65,
    ph:Math.random()*6.28,
  });
}
let t=0, ordered=0;
setTimeout(()=>{ ordered=1; }, 1900);
let mx=null,my=null;
addEventListener('mousemove',e=>{
  const r=hero.getBoundingClientRect();
  mx=(e.clientX-r.left)*dpr; my=(e.clientY-r.top)*dpr;
});
let raf=null, running=true;
// v2: Tab 隱藏時暫停粒子（慳 CPU，避免背景燒電）
document.addEventListener('visibilitychange',()=>{
  running = !document.hidden;
  if(running){ raf=requestAnimationFrame(draw); }
  else if(raf){ cancelAnimationFrame(raf); raf=null; }
});

function draw(){
  t+=0.005;
  ctx.clearRect(0,0,W,H);
  const easeCurve = ordered<1 ? 0.006 : 0.022;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const tx = targetX(i), ty = targetY(i);
    p.x += (tx-p.x)*easeCurve + p.vx;
    p.y += (ty-p.y)*easeCurve + p.vy - 0.05*dpr;
    p.vx*=.97; p.vy*=.97;

    if(mx!==null){
      const dx=p.x-mx, dy=p.y-my, d=Math.hypot(dx,dy);
      if(d<110*dpr){ p.x+=dx/d*3*dpr; p.y+=dy/d*3*dpr; }
    }
    const tw=0.55+0.45*Math.sin(t*2.2+p.ph);
    ctx.fillStyle = p.red
      ? `rgba(163,35,29,${p.a*tw})`
      : `rgba(25,25,22,${p.a*tw*0.7})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    if(p.red && p.r>1.8*dpr){
      ctx.fillStyle=`rgba(163,35,29,${p.a*tw*0.13})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3,0,6.283); ctx.fill();
    }
  }
  if(ordered>0.5){
    ctx.strokeStyle='rgba(163,35,29,0.16)';
    ctx.lineWidth=1*dpr;
    ctx.beginPath();
    for(let i=0;i<110;i++){
      const xx=W/2+(Math.sin(i*0.19)*W*0.34);
      const yy=H*0.46+(Math.cos(i*0.27)*H*0.20);
      i===0?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy);
    }
    ctx.stroke();
  }
  raf=requestAnimationFrame(draw);
}
raf=requestAnimationFrame(draw);

/* ---------- Scroll Reveal ---------- */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ---------- 文章資料 ---------- */
const POSTS = window.POSTS || [];

/* ---------- 分類欄自動生成 ---------- */
const CATS = {};
POSTS.forEach(p=>{ CATS[p.c]=CATS[p.c]||0; CATS[p.c]++; });
const colgrid=document.getElementById('colgrid');
if(Object.keys(CATS).length===0){
  colgrid.innerHTML=`<div class="empty"><span class="big">專欄整理中</span>文章後補 —— 分類會自動出現</div>`;
}else{
  let ci=0;
  for(const c in CATS){
    const el=document.createElement('div');
    el.className='col reveal';
    el.style.transitionDelay=(ci*0.06)+'s';
    el.setAttribute('tabindex','0');
    el.setAttribute('role','link');
    el.setAttribute('aria-label','睇「'+c+'」分類文章');
    el.innerHTML=`<div class="no">0${ci+1}</div><h3>${c}</h3><span class="cnt">${CATS[c]} 篇</span>`;
    el.addEventListener('click',()=>filterCat(c));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); filterCat(c); }
    });
    colgrid.appendChild(el);
    ci++;
  }
}

/* ---------- 文章列表渲染 ---------- */
const writebar=document.getElementById('writebar');
const postlist=document.getElementById('postlist');

function renderList(cat){
  postlist.innerHTML='';
  const list = POSTS.filter(p=>!cat || p.c===cat);
  if(list.length===0){
    postlist.innerHTML=`<div class="empty"><span class="big">未有文章</span>內文後補 —— 文章寫好就會喺呢度出現</div>`;
    return;
  }
  list.forEach((p,i)=>{
    const el=document.createElement('button');
    el.className='post reveal';
    el.style.transitionDelay=Math.min(i*0.04,0.4)+'s';
    el.setAttribute('type','button');
    el.innerHTML=`<span class="date">${p.d}</span><span class="tt">${p.t}</span><span class="cat">${p.c}</span><span class="arr">→</span>`;
    el.addEventListener('click',()=>openReader(p,el));
    postlist.appendChild(el);
  });
  document.querySelectorAll('#postlist .reveal').forEach(el=>io.observe(el));
}

/* 分類 filter 條 */
function buildBar(){
  writebar.innerHTML='';
  const keys=Object.keys(CATS);
  const all=document.createElement('button');
  all.className='f on'; all.textContent='全部'; all.setAttribute('type','button');
  all.addEventListener('click',()=>{ setFilter(null); });
  writebar.appendChild(all);
  for(const c of keys){
    const b=document.createElement('button');
    b.className='f'; b.textContent=c; b.setAttribute('type','button');
    b.addEventListener('click',()=>{ setFilter(c); });
    writebar.appendChild(b);
  }
  if(keys.length===0){ writebar.style.display='none'; }
}
let curCat=null;
function setFilter(c){
  curCat=c;
  document.querySelectorAll('#writebar .f').forEach(el=>{
    el.classList.toggle('on', el.textContent=== (c||'全部'));
  });
  renderList(c);
}
function filterCat(c){ setFilter(c); document.getElementById('writing').scrollIntoView({behavior:'smooth'}); }
buildBar(); renderList(null);

/* ---------- 文章讀取 ---------- */
const reader=document.getElementById('reader'), rbody=document.getElementById('rbody');
let lastFocus=null;
function openReader(p,triggerEl){
  lastFocus=triggerEl;
  rbody.innerHTML=`<p class="rmeta">${p.d}<span>•</span>${p.c}</p>`+
    `<h2 class="rtitle">${p.t}</h2>`+
    `<div class="rbody">${p.body}</div>`;
  reader.classList.add('open');
  document.body.style.overflow='hidden';
  reader.scrollTop=0;
  // v2: focus 入 modal，鍵盤用戶唔使摸黑
  const closeBtn=document.querySelector('#reader .close');
  closeBtn.focus();
}
document.querySelector('#reader .close').addEventListener('click',closeReader);
reader.addEventListener('click',e=>{ if(e.target===reader) closeReader(); });
function closeReader(){
  reader.classList.remove('open');
  document.body.style.overflow='';
  // v2: focus 歸位
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeReader(); });

/* ---------- 手機 hamburger ---------- */
const menubtn=document.getElementById('menubtn');
let menuOpen=false;
menubtn.addEventListener('click',()=>{
  menuOpen=!menuOpen;
  menubtn.setAttribute('aria-expanded',menuOpen);
  const nav=document.querySelector('header nav');
  nav.style.display = menuOpen ? 'flex' : '';
  if(menuOpen) nav.style.flexDirection='column';
});
// 手機 bottom nav 取代 header nav，hamburger 淨係 fallback
addEventListener('resize',()=>{
  if(window.innerWidth>900){
    document.querySelector('header nav').style.display='';
    menuOpen=false; menubtn.setAttribute('aria-expanded','false');
  }
});
</script>
<noscript>
  <div style="padding:80px 20px; text-align:center; font-family:Georgia,serif;">
    Hopan — 把混沌，煉成秩序。請啟用 JavaScript 以瀏覽文章。
  </div>
</noscript>
</body>
</html>
